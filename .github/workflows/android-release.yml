# Signed Android release, built in the cloud.
#
# The release key exists only as encrypted Actions secrets (see
# SpektraDroid/signing/README.md); no developer machine needs it.
#
#  * push a tag v<versionName>  -> build, verify, publish the GitHub Release
#  * Run workflow (dispatch)    -> build + verify only, APK as an artifact
name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of the release certificate (the key that signed the public 1.1,
  # alias spektralab-release). Every update must carry it, or Android refuses
  # to install it over an existing copy.
  RELEASE_CERT_SHA256: ba6855f06c3f7ebaeb708761190f3c970ed7b7fbfac283fd463070cedd67f122

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: SpektraDroid
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: LibRaw (pinned snapshot)
        run: bash tools/setup_libraw.sh

      - name: Release key from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is not set (SpektraDroid/signing/README.md)"; exit 1; }
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/release.properties"
          echo "SPEKTRALAB_SIGNING_PROPERTIES=$RUNNER_TEMP/release.properties" >> "$GITHUB_ENV"

      - name: Version
        id: version
        run: |
          version=$(sed -nE 's/^ *versionName = "([^"]+)".*/\1/p' app/build.gradle.kts | head -1)
          [ -n "$version" ] || { echo "::error::versionName not found"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match versionName $version"; exit 1
          fi

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature and package
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          bt="$ANDROID_HOME/build-tools/35.0.0"
          cert=$("$bt/apksigner" verify --print-certs "$apk" | sed -nE 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$cert" != "$RELEASE_CERT_SHA256" ]; then
            echo "::error::APK is signed by $cert, expected the release certificate $RELEASE_CERT_SHA256"; exit 1
          fi
          badging=$("$bt/aapt2" dump badging "$apk")
          echo "$badging" | grep -q "^package: name='com.spektralab.android' " \
            || { echo "::error::unexpected package name"; exit 1; }
          if echo "$badging" | grep -q "application-debuggable"; then
            echo "::error::release APK is debuggable"; exit 1
          fi
          name="SpektraLab-${{ steps.version.outputs.version }}.apk"
          mkdir -p dist && cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: SpektraLab-${{ steps.version.outputs.version }}
          path: |
            SpektraDroid/dist/
            SpektraDroid/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "::error::release $tag already exists; delete it or bump the version"; exit 1
          fi
          notes="docs/releases/$VERSION.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$tag" dist/* --verify-tag --title "SpektraLab for Android $VERSION" "$@"

      - name: Remove key material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/release.properties"
